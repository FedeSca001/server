<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Web App</title>
</head>
<body>

<h3>Buscar álbum</h3>
<div class="input-container">
    <input type="text" id="urlInput" placeholder="Buscar álbum">
    <p id="countAlbums"></p>
    <button id="buscarSql">Buscar en SQL</button>
</div>
<ul id="resultList"></ul>

<h3>Buscar elementos</h3>
<div class="input-container">
    <input type="text" id="elementInput" placeholder="Buscar elemento">
    <h2>Filtrar</h2>
    <select id="filterSelect">
        <option value="all" selected>All</option>
        <option value="Image">Image</option>
        <option value="Video">Video</option>
        <option value="file">File</option>
    </select>
    <h2>Ordenar</h2>
    <select id="sortType">
        <option value="all" selected>All</option>
        <option value="Video">Video</option>
        <option value="img">Imagen</option>
        <option value="size">Size</option>
        <option value="nombre">Nombre</option>
    </select>
    <p id="countCards"></p>
    <button id="buscarElemento">Buscar elemento</button>
</div>
<ul id="elementsList"></ul>

<div class="random-container">
    <h3>Álbumes aleatorios</h3>
    <button id="getRandomAlbums">Obtener álbumes</button>
</div>
<ul id="randomList"></ul>

<div class="topElements-container">
    <h3>Top elementos</h3>
    <button id="getTopElements">Ver top</button>
</div>
<ul id="topElementsList"></ul>
<button id="moreElements">Más elementos</button>

<script src="./index.js"></script>

</body>
</html>
