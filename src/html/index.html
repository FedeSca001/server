<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Web App</title>
</head>
<body>
    <h3>Buscar álbum</h3>
    <input type="text" id="urlInput" placeholder="Introduce una URL">
    <div class="input-container">
        <button id="buscarSql">Buscar en SQL</button>
        <ul id="resultList"></ul>
    </div>
    <div class="random-container">
        <h3>Álbumes aleatorios</h3>

        <button id="getRandomAlbums">Obtener álbumes</button>
        
        <ul id="randomList"></ul>
    </div>
    
    <div class="topElements-container">
        <h3>Top elementos</h3>
        <button id="getTopElements">Ver top</button>
        <ul id="topElementsList"></ul>
        <button id="moreElements">Más elementos</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
