<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Web App</title>
</head>
<body>
    <div class="input-container">
    <h2>Buscar álbum</h2>
    <input type="text" id="urlInput" placeholder="Introduce una URL">
    <button id="buscarSql">Buscar en SQL</button>
    <ul id="resultList"></ul>
</div>
    <div class="random-container">
        <h2>Álbumes aleatorios</h2>

        <button id="getRandomAlbums">Obtener álbumes</button>

        <ul id="randomList"></ul>
    </div>

    <div class="topElements-container">
        <h2>Top elementos</h2>

        <button id="getTopElements">Ver top</button>

        <ul id="topElementsList"></ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
