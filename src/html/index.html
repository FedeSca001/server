<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Web App</title>
</head>
<body>

    <!-- Buscar álbum -->
    <h3>Buscar álbum</h3>
    <input type="text" id="urlInput" placeholder="Buscar álbum">
    <div class="input-container">
        <button id="buscarSql">Buscar en SQL</button>
        <ul id="resultList"></ul>
    </div>

    <!-- Buscar elementos -->
    <h3>Buscar elementos</h3>
    <div class="input-container">
        <input type="text" id="elementInput" placeholder="Buscar elemento">

        <select id="filterSelect">
            <option value="all" selected>All</option>
            <option value="date">Date</option>
            <option value="size">Size</option>
            <option value="type">Type</option>
        </select>

        <div class="checkbox-group">
            <input type="checkbox" id="recursiveCheck">
            <label for="recursiveCheck">Recursivo</label>
        </div>

        <button id="buscarElemento">Buscar elemento</button>
    </div>

    <ul id="elementsList"></ul>

    <!-- Álbumes aleatorios -->
    <div class="random-container">
        <h3>Álbumes aleatorios</h3>
        <button id="getRandomAlbums">Obtener álbumes</button>
        <ul id="randomList"></ul>
    </div>

    <!-- Top elementos -->
    <div class="topElements-container">
        <h3>Top elementos</h3>
        <button id="getTopElements">Ver top</button>
        <ul id="topElementsList"></ul>
        <button id="moreElements">Más elementos</button>
    </div>

    <script src="index.js"></script>

</body>
</html>
